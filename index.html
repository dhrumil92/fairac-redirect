<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Redirecting...</title>

    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            text-align: center;
            padding: 50px 20px;
            background: #f5f7fa;
            color: #333;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #0070f3;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            margin-top: 20px;
        }

        .btn:hover {
            background: #005cc5;
        }
    </style>

    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () {
            (window.vaq = window.vaq || []).push(arguments);
        };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>

<body>
    <h2>Redirecting...</h2>
    <p>You will be redirected automatically.</p>

    <a href="http://136.66.184.105/" class="btn">
        Open Website
    </a>

    <script>
        const destination = "http://136.66.184.105/";

        // Give Vercel Analytics a short moment to initialize.
        window.addEventListener("DOMContentLoaded", function () {
            setTimeout(function () {
                // replace() prevents the redirect page from being added
                // to the browser's back-button history.
                window.location.replace(destination);
            }, 500);
        });
    </script>
</body>
</html>
